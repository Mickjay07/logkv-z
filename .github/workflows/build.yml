name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install pynput requests psutil pywin32 uiautomation Pillow pyinstaller
    
    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name SystemService logger.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SystemService-Windows
        path: dist/SystemService.exe
    
    - name: Get version
      id: version
      shell: pwsh
      run: |
        $content = Get-Content logger.py -Raw
        if ($content -match 'APP_VERSION\s*=\s*"(\d+)"') {
          echo "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
        } else {
          echo "version=unknown" >> $env:GITHUB_OUTPUT
        }
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: v${{ steps.version.outputs.version }}
        files: dist/SystemService.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
